repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: no-env-files
        name: block .env / key files
        entry: bash -c 'for f in "$@"; do case "$f" in .env|.env.*|*token*.txt|*api_key*) [ "$f" != ".env.example" ] && { echo "refusing to commit $f"; exit 1; };; esac; done' --
        language: system
        pass_filenames: true
