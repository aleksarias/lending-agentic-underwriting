[project]
name = "lending-agentic-underwriting"
version = "0.1.0"
description = "Agentic underwriting-improvement system: agents propose, a deterministic harness judges, a human approves."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "xgboost>=2.1",
  "duckdb>=1.1",
  "sqlglot>=25",
  "mlflow>=2.16",
  "databricks-sdk>=0.40",
  "databricks-sql-connector>=3.4",
  "claude-agent-sdk>=0.1",
  "python-dotenv>=1.0",
  "tabulate>=0.10.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
lau = "lau.cli:app"
lau-job = "lau.jobs:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lau"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"src/lau/reports.py" = ["E501"]  # report prose: sentences stay on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: hits the live Databricks workspace (needs profiles from `lau init`)"]
addopts = "-m 'not integration'"
