# Databricks Asset Bundle for lending-agentic-underwriting.
# dev runs the schedules (UNPAUSED); prod deploys PAUSED. The same `lau` entry points run locally and on serverless.
bundle:
  name: lending-agentic-underwriting

variables:
  harness_sp:
    description: Application ID of the lau-harness service principal (see .lau/workspace_state.json)
  ui_sp:
    description: Application ID of the lau-ui service principal (the console's read-only identity)
  environment_version:
    description: Serverless environment version (v3-v5 = Python 3.12, matching the local toolchain)
    default: "4"
  schedule_pause_status:
    description: PAUSED or UNPAUSED for every job schedule (development mode only honours an explicit value)
    default: PAUSED

artifacts:
  lau_wheel:
    type: whl
    build: uv build --wheel
    path: .

include:
  - resources/*.yml

# Jobs read workspace ids (warehouse, catalog, service principals; no secrets) from the git-ignored state file.
sync:
  include:
    - .lau/workspace_state.json

# The jobs run as the harness service principal, which must read the deployed wheel in the bundle's workspace folder
# (top-level permissions also apply to that folder).
permissions:
  - level: CAN_VIEW
    service_principal_name: ${var.harness_sp}

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-67e8cd43-5f63.cloud.databricks.com
    variables:
      schedule_pause_status: UNPAUSED  # schedules on since 2026-10-01 (estimate ~$50-70/month; check with `lau cost`)
  prod:
    mode: production
    workspace:
      host: https://PLACEHOLDER-prod-workspace.cloud.databricks.com  # TODO: set when a prod workspace exists
    presets:
      trigger_pause_status: PAUSED
