# Scheduled jobs. Every target deploys them PAUSED; turn them on per job in the workspace (or `lau schedules on`).
# One daily job wakes the SQL warehouse once a day for all routine work (synthetic decisions and the loan feed included); the weekly job runs an improvement cycle
# only when one is queued. Both email the deploying user on failure, and the console's read-only identity may view them.
resources:
  jobs:
    lau_daily:
      name: lau-daily
      run_as:
        service_principal_name: ${var.harness_sp}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      permissions:
        - level: CAN_VIEW
          service_principal_name: ${var.ui_sp}
      environments:
        - environment_key: lau
          spec:
            environment_version: ${var.environment_version}
            dependencies: ["../dist/*.whl", "scikit-learn==1.9.1", "lightgbm==4.7.0", "xgboost==3.4.1"]  # = uv.lock: pickled models load only with the versions that trained them (test_job_pins)
      tasks:
        - task_key: definition_sync
          environment_key: lau
          python_wheel_task: {package_name: lending_agentic_underwriting, entry_point: lau-job, parameters: ["definition-sync", "--root", "${workspace.file_path}"]}
        - task_key: decisions
          depends_on: [{task_key: definition_sync}]
          run_if: ALL_DONE
          environment_key: lau
          python_wheel_task: {package_name: lending_agentic_underwriting, entry_point: lau-job, parameters: ["decisions", "--root", "${workspace.file_path}"]}
        - task_key: feedback
          depends_on: [{task_key: decisions}]
          run_if: ALL_DONE
          environment_key: lau
          python_wheel_task: {package_name: lending_agentic_underwriting, entry_point: lau-job, parameters: ["feedback", "--root", "${workspace.file_path}"]}
        - task_key: shadow
          depends_on: [{task_key: feedback}]
          run_if: ALL_DONE
          environment_key: lau
          python_wheel_task: {package_name: lending_agentic_underwriting, entry_point: lau-job, parameters: ["shadow", "--root", "${workspace.file_path}"]}
        - task_key: monitor
          depends_on: [{task_key: shadow}]
          run_if: ALL_DONE
          environment_key: lau
          python_wheel_task: {package_name: lending_agentic_underwriting, entry_point: lau-job, parameters: ["monitor", "--root", "${workspace.file_path}"]}
        - task_key: evidence
          depends_on: [{task_key: monitor}]
          run_if: ALL_DONE
          environment_key: lau
          python_wheel_task: {package_name: lending_agentic_underwriting, entry_point: lau-job, parameters: ["evidence", "--root", "${workspace.file_path}"]}
        - task_key: console_snapshot
          depends_on: [{task_key: evidence}]
          run_if: ALL_DONE
          environment_key: lau
          python_wheel_task: {package_name: lending_agentic_underwriting, entry_point: lau-job, parameters: ["console-snapshot", "--root", "${workspace.file_path}"]}
      timeout_seconds: 5400

    lau_improvement_cycle:
      name: lau-improvement-cycle
      run_as:
        service_principal_name: ${var.harness_sp}
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"
        timezone_id: UTC
      email_notifications:
        on_failure: ["${workspace.current_user.userName}"]
      permissions:
        - level: CAN_VIEW
          service_principal_name: ${var.ui_sp}
      environments:
        - environment_key: lau
          spec:
            environment_version: ${var.environment_version}
            dependencies: ["../dist/*.whl", "scikit-learn==1.9.1", "lightgbm==4.7.0", "xgboost==3.4.1"]  # = uv.lock: pickled models load only with the versions that trained them (test_job_pins)
      tasks:
        - task_key: cycle
          environment_key: lau
          python_wheel_task: {package_name: lending_agentic_underwriting, entry_point: lau-job, parameters: ["run-cycle-if-queued", "--root", "${workspace.file_path}"]}
      timeout_seconds: 5400
